http {

    server {
        client_max_body_size    1;
        listen                  127.0.0.1:8080;
        server_name             instanceA;
        
        root    ./www;

        error_page 404 /errors/404.html;
        error_page 500 /errors/500.html;

        location / {
            index root.html;
            methods GET POST;
            autoindex off;
        }

        location /cgi {
            root ./www;
            cgi_extension .php;
            cgi_path /usr/bin/php-cgi;
            methods GET POST DELETE;
        }

        location /html1 {
            index index.html;
            methods GET POST;
            autoindex off;
        }
    }
}
