http {

    server {
        client_max_body_size 10M;
        listen 127.0.0.1:8080;
        server_name www.webserv1.com;
        
        root /home/rivoinfo/Videos/Webserv/webservrivo/servers;
        
        error_page 400 /errors/400.html;
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 405 /errors/405.html;
        error_page 408 /errors/408.html;
        error_page 413 /errors/413.html;
        error_page 500 /errors/500.html;
        error_page 505 /errors/505.html;

        location /bootstrap/ {
            root /home/rivoinfo/Videos/Webserv/webservrivo/servers;
            methods GET;
        }

        location / {
            root /home/rivoinfo/Videos/Webserv/webservrivo/clients/www1;
            index /cgi_bin/index.html;
            methods GET POST DELETE;
            autoindex off;

        }

        location /private {
            root /home/rivoinfo/Videos/Webserv/webservrivo/servers;
            methods GET POST DELETE;
        }

        location /test {
            root /home/rivoinfo/Videos/Webserv/webservrivo/servers;
            index index.html;
            methods POST GET DELETE;
            redirect http://www.google.com 303;
            autoindex on;
        }

        location /cgi_bin {
            root /home/rivoinfo/Videos/Webserv/webservrivo/clients/www1/cgi_bin;
            cgi_extension .php;
            cgi_path /usr/bin/php-cgi;
            methods GET POST DELETE;

        }

        location /uploads {
            root /home/rivoinfo/Videos/Webserv/webservrivo/servers;
            index index.html;
            methods GET POST DELETE;
            autoindex off;
        }
    }

    server {
        client_max_body_size 10000000;
        listen 127.0.0.2:8081;
        server_name webserv2.com;

        root /home/rivoinfo/Videos/Webserv/webservrivo/servers;
        
        location / {
            root /home/rivoinfo/Videos/Webserv/webservrivo/clients/www2;
            index index.html;
            methods GET POST DELETE;
        }
    }

    server {
        client_max_body_size 10000000;
        listen 127.0.0.3:8082;
        server_name webserv3.com;
        
        root /home/rivoinfo/Videos/Webserv/webservrivo/servers;
        
        location / {
            root /home/rivoinfo/Videos/Webserv/webservrivo/clients/www3;
            index index1.html;
            methods GET POST DELETE;
        }
    }
}