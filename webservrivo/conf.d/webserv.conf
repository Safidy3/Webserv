http {
    server {
        client_max_body_size 100ssssssssssssssssss;
        listen 8.8.8.8:8080sdfksljdfljskdjfkl;
        server_name webserv1.com localhost;
        root /home/rhanitra/Videos/Webserv/webservrivo/servers;
        
        error_page 400 /errors/400.html;
        error_page 403 /errors/403.html;
        error_page 404 /errors/404.html;
        error_page 405 /errors/405.html;
        error_page 408 /errors/408.html;
        error_page 413 /errors/413.html;
        error_page 500 /errors/500.html;
        error_page 505 /errors/505.html;

        location /bootstrap/ {
            root /home/rhanitra/Videos/Webserv/webservrivo/servers;
            methods GET;
        }

        location / {
            root /home/rhanitra/Videos/Webserv/webservrivo/clients/www1;
            index test/index.html;
            methods GET POST DELETE;
            autoindex off;
        }

        location /private {
            root /home/rhanitra/Videos/Webserv/webservrivo/servers;
            methods GET POST DELETE;
        }

        location /test {
            root /home/rhanitra/Videos/Webserv/webservrivo/servers;
            index index.html;
            methods POST GET DELETE;
            redirect http://www.google.com 303;
            autoindex on;
        

        location /cgi_bin {
            root /home/rhanitra/Videos/Webserv/webservrivo/clients/www1/cgi_bin;
            cgi_extension .php;
            cgi_path /usr/bin/php-cgi;
            methods GET POST DELETE;

        }

        location /uploads {
            root /home/rhanitra/Videos/Webserv/webservrivo/servers;
            index index.html;
            methods GET POST DELETE;
            autoindex off;
        }
    }

}
